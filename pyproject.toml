[project]
name = "yuhuo-tts"
version = "0.1.0"
description = "FastAPI service for CosyVoice2/Qwen3 TTS with MFA alignment"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "audioread>=3.0.0",
    "conformer==0.3.2",
    "diffusers==0.29.0",
    "fastapi>=0.104.0",
    "gunicorn>=21.0.0",
    "hydra-core==1.3.2",
    "hyperpyyaml==1.2.3",
    "inflect==7.3.1",
    "librosa>=0.10.0",
    "modelscope>=1.0.0",
    "montreal-forced-aligner>=3.0.0",
    "numpy>=2.0.0",
    "omegaconf==2.3.0",
    "dragonmapper>=0.3.0",
    "hanziconv>=0.3.2",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.6",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "scipy>=1.13.0",
    "soundfile>=0.12.0",
    "tiktoken>=0.7.0",
    "textgrid>=1.5",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "uvicorn[standard]>=0.24.0",
    "spacy-pkuseg>=0.0.33",
    "x-transformers==2.11.24",
    "qwen-tts",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
]

[tool.uv]
package = false

[tool.uv.sources]
qwen-tts = { git = "https://github.com/QwenLM/Qwen3-TTS.git" }
