version: '3.8'

services:
  tts-api:
    build: .
    container_name: tts-alignment-api
    env_file:
      - .env.cloud
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./output_audio:/app/output_audio
      - ./logs:/app/logs
      - ./temp_audio:/app/temp_audio
    environment:
      - CUDA_VISIBLE_DEVICES=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
